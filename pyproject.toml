[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marathon2"
version = "0.1.0"
description = "GitHub task priority sync and ranking system with Firebase and Pydantic AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "firebase-functions>=0.4.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.16.0",
    "pydantic>=2.6.0",
    "pydantic-ai>=2.0.0",
    "flask>=3.0.0",
    "jinja2>=3.1.2",
    "PyGithub>=2.10.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["functions"]

[tool.hatch.envs.default]
skip-install = true
dependencies = [
    "pyright",
    "pytest",
    "ruff",
    "firebase-functions>=0.4.0",
    "firebase-admin>=6.5.0",
    "google-cloud-firestore>=2.16.0",
    "pydantic>=2.6.0",
    "pydantic-ai>=2.0.0",
    "flask>=3.0.0",
    "jinja2>=3.1.2",
    "PyGithub>=2.10.0",
]

[tool.hatch.envs.default.scripts]
test = "python -m unittest discover -s . -p \"test_*.py\""
types = "pyright"
lint = "ruff check ."
format = "ruff format ."
all = [
    "ruff check .",
    "pyright",
    "python -m unittest discover -s . -p \"test_*.py\"",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501",  # Line too long (managed by formatter)
    "B008",  # Do not perform function calls in argument defaults (standard in Pydantic Field)
]

[tool.ruff.lint.isort]
known-first-party = ["functions", "user", "task", "github_sync", "genai_ranker", "main", "dev"]

